<!doctype html><meta charset="utf-8"><title>мобильная проверка</title>
<style>body{margin:0;background:#ddd;font:11px ui-monospace,monospace}
.row{display:flex;gap:10px;padding:10px;align-items:flex-start}
figure{margin:0;background:#fff}
iframe{border:0;display:block;background:#FBFAF6}
figcaption{padding:4px}</style>
<div class="row" id=r></div>
<script>
var q=new URLSearchParams(location.search);
var page=q.get('p')||'index.html';
var sizes=[[390,820],[768,820]];
document.getElementById('r').innerHTML=sizes.map(function(s){
var sep = page.indexOf('?') > -1 ? '&' : '?';
return '<figure><iframe src="../'+page+sep+'motion=on" width="'+s[0]+'" height="'+s[1]+'"></iframe>'+
'<figcaption>'+s[0]+'×'+s[1]+'</figcaption></figure>';}).join('');
</script>
